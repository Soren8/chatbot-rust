webserver:
  image:
    repository: chatbot-rust
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 1
  # Chart-only host networking; root Compose webserver also uses host networking.
  hostNetwork: true
  service:
    type: ClusterIP
    port: 80
  bindAddr: "0.0.0.0:80"
  resources: {}
  env:
    LOG_FORMAT: json
    LOG_ANSI: "false"
    LOG_LEVEL: info
    SESSION_PURGE_INTERVAL_SECS: "300"
    HOST_DATA_DIR: /app/data
    CHATBOT_STATIC_ROOT: /app/static
  secretEnv:
    # Set each variable to {name: kubernetes-secret-name, key: secret-data-key}.
    # Unset entries are omitted; nonempty plaintext values fail rendering.
    # SECRET_KEY: {name: chatbot-secrets, key: SECRET_KEY}
    # OPENAI_API_KEY: {name: chatbot-secrets, key: OPENAI_API_KEY}
  persistence:
    enabled: true
    size: 10Gi
    mountPath: /app/data
  config:
    # Inline stub; mount real .config.yml content in production.
    enabled: true
    mountPath: /app/.config.yml

# SAMPLE ONLY / UNSUPPORTED: no template under templates/ reads
# .Values.voiceService, so `enabled` is accepted but has no effect (there is
# no voice-service Deployment). Run chatbot-voice on the GPU host / bare
# metal (or use a hosted OpenAI-compatible provider) and point the tts:/stt:
# blocks in the ConfigMap at it.
voiceService:
  enabled: false
  image:
    repository: chatbot-voice-service
    tag: latest
  hostNetwork: true
  port: 5100
