# Local development override (debug build, human-readable logs).
# Usage:
#   docker compose -f docker-compose.yml -f deploy/compose/docker-compose.dev.override.yml up --build

services:
  webserver:
    build:
      args:
        # Pinned (not a default): dev must stay a debug build even when the
        # environment exports RUST_BUILD_PROFILE=release for other targets.
        RUST_BUILD_PROFILE: debug
    environment:
      # Pinned (not defaults): dev forces human-readable logs even when the
      # environment exports production-style LOG_FORMAT/LOG_ANSI values.
      LOG_FORMAT: plain
      LOG_ANSI: "true"
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      SESSION_PURGE_INTERVAL_SECS: ${SESSION_PURGE_INTERVAL_SECS:-60}
