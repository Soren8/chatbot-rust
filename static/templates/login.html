<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="/static/deps/bootstrap/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-dark text-light login-page">
    <div class="container login-container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-6 col-lg-4">
                <div class="card bg-dark text-light border-secondary">
                    <div class="card-header">
                        <h1 class="text-center mb-0">Login</h1>
                    </div>
                    <div class="card-body">
                        <form action="/login" method="post">
                            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                            <div id="saved-account-section" class="mb-3 d-none">
                                <label for="saved-account-select" class="form-label">Account:</label>
                                <div class="d-flex gap-2 align-items-center">
                                    <select id="saved-account-select" class="form-select bg-dark text-light border-secondary"></select>
                                    <button type="button" id="forget-account" class="btn btn-outline-danger flex-shrink-0" title="Forget this account on this computer">&#10005;</button>
                                </div>
                                <p class="form-text text-hint small mb-0 mt-2">✕ forgets this account on this computer. Switching accounts from chat does not.</p>
                            </div>
                            <div id="username-section" class="mb-3">
                                <label for="username" class="form-label">Username:</label>
                                <input type="text" class="form-control bg-dark text-light border-secondary" name="username" id="username" required autofocus>
                            </div>
                            <div id="password-fields">
                                <div class="mb-3">
                                    <label for="password" class="form-label">Password:</label>
                                    <input type="password" class="form-control bg-dark text-light border-secondary" name="password" id="password" required>
                                </div>
                                <div class="form-check mb-3">
                                <input class="form-check-input" type="checkbox" name="remember_me" id="remember_me" value="on" checked>
                                <label class="form-check-label" for="remember_me">Remember this computer for 30 days</label>
                                </div>
                            </div>
                            <div id="login-notice" class="alert alert-warning py-2 d-none" role="alert"></div>
                            <div class="d-grid">
                                <input type="submit" class="btn btn-primary" value="Login">
                            </div>
                        </form>
                        <div class="text-center mt-3">
                            <a href="/signup" class="text-decoration-none">Don't have an account? Sign up</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="/static/tt.js"></script>
    <script src="/static/deps/jquery/jquery-3.6.0.min.js"></script>
    <script src="/static/deps/bootstrap/bootstrap.bundle.min.js"></script>
    <script src="/static/native-bridge.js"></script>
    <script src="/static/enc-key.js"></script>
    <script src="/static/login.js"></script>
</body>
</html>
