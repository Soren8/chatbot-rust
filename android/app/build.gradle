import groovy.json.JsonSlurper
import org.gradle.api.artifacts.type.ArtifactTypeDefinition

apply plugin: 'com.android.application'

// The tracked root capacitor.config.json is the single source of truth for
// native origins. It defines BOTH serverUrls (emulator + physical) with no
// server.url override; each flavor projects its own entry into the
// server_url resource, which is the single canonical native origin at
// runtime (see ServerUrlResolver). Never hardcode endpoint literals here.
// (Unknown top-level keys are ignored by Capacitor/CapConfig, so the
// serverUrls block never becomes a WebView override.)
def capacitorConfigFile = rootProject.file('../capacitor.config.json')
def capacitorConfig = new JsonSlurper().parse(capacitorConfigFile)
def sileroModelFile = rootProject.file('../static/deps/vad/silero_vad_v5.onnx')
def generatedSileroAssets = layout.buildDirectory.dir('generated/sileroVadAssets/main')
def copySileroVadModel = tasks.register('copySileroVadModel', Copy) {
    from sileroModelFile
    into generatedSileroAssets
}
def emulatorServerUrl = capacitorConfig?.serverUrls?.emulator
def physicalServerUrl = capacitorConfig?.serverUrls?.physical
if (!(emulatorServerUrl instanceof String) || emulatorServerUrl.isEmpty()
        || !(physicalServerUrl instanceof String) || physicalServerUrl.isEmpty()) {
    throw new GradleException(
            "capacitor.config.json must define serverUrls.emulator and serverUrls.physical "
            + "(looked in " + capacitorConfigFile + ")")
}

android {
    namespace = "com.chatbot.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.chatbot.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildFeatures {
        // ClientLogReporter gates on BuildConfig.DEBUG (AGP 8 disables the
        // generated BuildConfig class by default).
        buildConfig true
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    sourceSets {
        main.assets.srcDir(generatedSileroAssets)
    }
    testOptions {
        unitTests.all {
            systemProperty 'chatbot.sileroModelPath', sileroModelFile.absolutePath
        }
    }
    flavorDimensions += "environment"
    productFlavors {
        emulator {
            dimension "environment"
            resValue "string", "server_url", emulatorServerUrl
        }
        physical {
            dimension "environment"
            resValue "string", "server_url", physicalServerUrl
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn(copySileroVadModel)
}

// Resolve unit-test runtime dependencies during compilation for offline test runs.
def resolvePhysicalUnitTestRuntime = tasks.register('resolvePhysicalUnitTestRuntime') {
    doLast {
        configurations.named('physicalDebugUnitTestRuntimeClasspath').get()
                .incoming.artifactView {
                    attributes.attribute(ArtifactTypeDefinition.ARTIFACT_TYPE_ATTRIBUTE, 'android-classes-jar')
                }.files.files
    }
}
tasks.matching { it.name == 'compilePhysicalDebugUnitTestJavaWithJavac' }.configureEach {
    dependsOn(resolvePhysicalUnitTestRuntime)
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation "androidx.biometric:biometric:1.1.0"
    // Pure-Java Opus decoder for TTS clips (no NDK, no OEM codec variance).
    implementation "io.github.jaredmdobson:concentus:1.0.2"
    implementation project(':capacitor-cordova-android-plugins')

    implementation "androidx.car.app:app:1.4.0"
    implementation "androidx.car.app:app-projected:1.4.0"
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.30.0'
    // Desktop native runtime lets JVM unit tests execute the exact packaged Silero model.
    testImplementation 'com.microsoft.onnxruntime:onnxruntime:1.30.0'
}

configurations.configureEach { configuration ->
    if (configuration.name.endsWith('UnitTestRuntimeClasspath')) {
        configuration.exclude group: 'com.microsoft.onnxruntime', module: 'onnxruntime-android'
    }
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
